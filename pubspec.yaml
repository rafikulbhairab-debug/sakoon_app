name: sakoon_app
description: "Sakoon — personal Islamic productivity app: prayer-time alarms, task reminders, tasbih, and notes."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Prayer time calculation — runs fully on-device, no API/internet needed
  adhan_dart: ^1.1.2

  # Alarms & scheduled notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^1.0.8

  # Location for prayer-time calculation
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # Local, offline-first storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Calendar UI for the task screen
  table_calendar: ^3.1.2

  # Formatting & type
  intl: ^0.19.0
  google_fonts: ^6.2.1

  # --- Phase 2: Tasbih + Notes ---
  # (no new packages — built on Hive + core Flutter)

  # --- Phase 3: Backup & recovery ---
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1
  share_plus: ^10.1.2
  file_picker: ^8.1.3

  # --- Phase 5 bonus: Qibla + Hijri calendar ---
  flutter_compass: ^0.8.1
  hijri: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

# NOTE: run `flutter pub get` after copying this file into a project created
# with `flutter create .` — see README.md for the exact setup steps.
# If any version above has been superseded, run:
#   flutter pub upgrade --major-versions
# and pub will resolve to the latest compatible releases.
